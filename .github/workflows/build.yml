name: Build binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, Clippy and tests (Rust 1.93)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build requirements
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: quality-1.93-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: cargo fmt --all -- --check
      # Existing style warnings remain visible. Correctness lints and compiler
      # errors block the build; no blanket lint suppression is introduced.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D clippy::correctness
      - name: Tests (library and TUI)
        run: cargo test --locked --all-targets

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      # No advisory IDs are ignored. Informational warnings are tracked in
      # docs/ENGINEERING_AUDIT.md; vulnerabilities fail this job by default.
      - name: Audit locked dependencies
        run: cargo audit

  linux-x86_64:
    if: github.event_name != 'schedule'
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-x86_64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-x86_64-cargo-
      - name: Build
        run: cargo build --locked --release --bin session-tui
      - name: Name binary
        run: cp target/release/session-tui session-tui-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: session-tui-linux-x86_64
          path: session-tui-linux-x86_64
          if-no-files-found: error

  macos-arm64:
    if: github.event_name != 'schedule'
    name: macOS ARM64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install protobuf compiler
        run: brew install protobuf
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-arm64-cargo-
      - name: Build
        run: cargo build --locked --release --bin session-tui
      - name: Name binary
        run: cp target/release/session-tui session-tui-macos-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: session-tui-macos-aarch64
          path: session-tui-macos-aarch64
          if-no-files-found: error

  windows-x86_64:
    if: github.event_name != 'schedule'
    name: Windows x86_64 (GNU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install protobuf and MinGW toolchain
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          targets: x86_64-pc-windows-gnu
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-x86_64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-x86_64-cargo-
      - name: Build
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          WINDRES: x86_64-w64-mingw32-windres
        run: cargo build --locked --release --target x86_64-pc-windows-gnu --bin session-tui
      - name: Name binary
        run: cp target/x86_64-pc-windows-gnu/release/session-tui.exe session-tui-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: session-tui-windows-x86_64
          path: session-tui-windows-x86_64.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, dependency-audit, linux-x86_64, macos-arm64, windows-x86_64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
